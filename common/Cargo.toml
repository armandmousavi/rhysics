[package]
name = "rhysics-common"
version = "0.1.0"
edition = "2021"

[features]
default = []
egui = ["dep:bevy_egui"]

[dependencies]
bevy = { workspace = true }
log = { workspace = true }
bevy_egui = { version = "0.38", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true }

[lib]
crate-type = ["rlib"]

