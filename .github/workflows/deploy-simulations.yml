name: Build and Deploy Simulations

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout rhysics
        uses: actions/checkout@v4
      
      - name: Checkout target repo (armandmousavi.github.io)
        uses: actions/checkout@v4
        with:
          repository: armandmousavi/armandmousavi.github.io
          path: target-repo
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      
      - name: Build all simulations
        run: |
          export EXPORT_TARGET_DIR="${GITHUB_WORKSPACE}/target-repo/rhysics"
          export CI=true
          rm -rf "$EXPORT_TARGET_DIR"
          mkdir -p "$EXPORT_TARGET_DIR"
          ./export.sh --all "$EXPORT_TARGET_DIR"
      
      - name: Commit and push to GitHub Pages repo
        run: |
          cd target-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A rhysics/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update rhysics simulations from rhysics@${{ github.sha }}"
            git push
          fi
